<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --warm-bg: #FDF8F3;
      --cream: #FAF0E6;
      --accent: #C4956A;
      --accent-light: #E8D5C0;
      --text-dark: #3B2F2F;
      --text-muted: #7A6A5E;
      --serif: 'Lora', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--warm-bg);
      color: var(--text-dark);
      line-height: 1.7;
    }

    /* ── Hero ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero-image-placeholder {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--cream) 100%);
      opacity: 0.4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-image-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 700px;
    }

    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    .hero .subtitle {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: var(--accent);
      margin: 0 auto;
    }

    /* ── Section shared ── */
    section {
      padding: 5rem 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    section h2 {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-dark);
    }

    section .section-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .section-divider {
      width: 40px;
      height: 2px;
      background: var(--accent);
      margin-bottom: 2rem;
    }

    /* ── About the Sponsor ── */
    .about-sponsor {
      background: var(--cream);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 900px;
      margin: 0 auto 0;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 3rem;
      align-items: center;
    }

    .sponsor-photo {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--accent-light);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 4px solid white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .sponsor-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sponsor-photo .placeholder-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .sponsor-text h2 {
      margin-bottom: 0.3rem;
    }

    .sponsor-text .sponsor-name {
      font-family: var(--serif);
      font-style: italic;
      color: var(--accent);
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    .sponsor-text .bio-placeholder {
      min-height: 120px;
      border: 2px dashed var(--accent-light);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 1rem;
    }

    /* ── Letter ── */
    .letter-section {
      background: white;
      border-radius: 16px;
      padding: 3.5rem 3rem;
      max-width: 750px;
      margin: 0 auto;
      box-shadow: 0 2px 30px rgba(0,0,0,0.04);
      border: 1px solid rgba(196,149,106,0.15);
    }

    .letter-section .greeting {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.2rem;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }

    .letter-body-placeholder {
      min-height: 300px;
      border: 2px dashed var(--accent-light);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 2rem;
      text-align: center;
      line-height: 2;
    }

    .letter-section .signature {
      margin-top: 2rem;
      text-align: right;
      font-family: var(--serif);
      font-style: italic;
      color: var(--text-muted);
    }

    .signature-placeholder {
      display: inline-block;
      min-width: 180px;
      border-bottom: 1px solid var(--accent-light);
      padding-bottom: 0.3rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ── Photo Gallery ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .gallery-item {
      aspect-ratio: 4 / 3;
      background: var(--accent-light);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover { transform: scale(1.02); }

    .gallery-item.tall {
      grid-row: span 2;
      aspect-ratio: auto;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-item .placeholder-label {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .gallery-caption {
      margin-top: 0.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ── Milestones ── */
    .milestones {
      position: relative;
      padding-left: 2.5rem;
    }

    .milestones::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--accent-light);
    }

    .milestone {
      position: relative;
      margin-bottom: 2.5rem;
    }

    .milestone::before {
      content: '';
      position: absolute;
      left: -2.65rem;
      top: 0.5rem;
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
    }

    .milestone-date {
      font-size: 0.8rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
      margin-bottom: 0.3rem;
    }

    .milestone-date-placeholder,
    .milestone-text-placeholder {
      display: inline-block;
      min-width: 100px;
      border-bottom: 1px dashed var(--accent-light);
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .milestone-text-placeholder {
      min-width: 300px;
      display: block;
      min-height: 1.5em;
    }

    /* ── Closing ── */
    .closing {
      text-align: center;
      padding: 5rem 2rem 4rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .closing-image-placeholder {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--accent-light);
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 3px solid white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .closing-image-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .closing-image-placeholder .placeholder-label {
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .closing-message-placeholder {
      min-height: 60px;
      border: 2px dashed var(--accent-light);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .closing .divider { margin: 2rem auto; }

    .closing-name-placeholder {
      font-family: var(--serif);
      font-size: 1.1rem;
      color: var(--text-muted);
      border-bottom: 1px dashed var(--accent-light);
      display: inline-block;
      min-width: 150px;
      padding-bottom: 0.2rem;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--accent-light);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .about-sponsor {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 2rem 1.5rem;
      }
      .sponsor-photo {
        max-width: 220px;
        margin: 0 auto;
      }
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .gallery-item.tall {
        grid-row: span 1;
        aspect-ratio: 4 / 3;
      }
      .letter-section {
        padding: 2rem 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ── Fade-in animation ── */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- ════ HERO ════ -->
  <header class="hero">
    <div class="hero-image-placeholder">
      <!-- Replace with: <img src="your-hero-image.jpg" alt=""> -->
      <span class="placeholder-label">Hero Background Image</span>
    </div>
    <div class="hero-content">
      <h1><!-- Title text here --></h1>
      <p class="subtitle"><!-- Subtitle text here --></p>
      <div class="divider"></div>
    </div>
  </header>

  <!-- ════ ABOUT THE SPONSOR ════ -->
  <section>
    <div class="about-sponsor fade-in">
      <div class="sponsor-photo">
        <!-- Replace with: <img src="sponsor-photo.jpg" alt=""> -->
        <span class="placeholder-label">Photo</span>
      </div>
      <div class="sponsor-text">
        <h2><!-- Section heading here --></h2>
        <p class="sponsor-name"><!-- Sponsor name here --></p>
        <div class="bio-placeholder">
          <!-- Bio / description text here -->
          Sponsor bio text goes here
        </div>
      </div>
    </div>
  </section>

  <!-- ════ THE LETTER ════ -->
  <section>
    <div class="letter-section fade-in">
      <p class="greeting"><!-- Greeting here --></p>
      <div class="letter-body-placeholder">
        <!-- Main thank-you letter text here -->
        Your thank-you letter goes here
      </div>
      <div class="signature">
        <span class="signature-placeholder"><!-- Your name --></span>
      </div>
    </div>
  </section>

  <!-- ════ PHOTO GALLERY ════ -->
  <section>
    <h2 class="fade-in"><!-- Gallery heading here --></h2>
    <p class="section-subtitle fade-in"><!-- Gallery subtitle here --></p>
    <div class="section-divider fade-in"></div>
    <div class="gallery-grid fade-in">
      <div class="gallery-item tall">
        <!-- <img src="photo1.jpg" alt=""> -->
        <span class="placeholder-label">Photo 1</span>
      </div>
      <div class="gallery-item">
        <!-- <img src="photo2.jpg" alt=""> -->
        <span class="placeholder-label">Photo 2</span>
      </div>
      <div class="gallery-item">
        <!-- <img src="photo3.jpg" alt=""> -->
        <span class="placeholder-label">Photo 3</span>
      </div>
      <div class="gallery-item">
        <!-- <img src="photo4.jpg" alt=""> -->
        <span class="placeholder-label">Photo 4</span>
      </div>
      <div class="gallery-item">
        <!-- <img src="photo5.jpg" alt=""> -->
        <span class="placeholder-label">Photo 5</span>
      </div>
    </div>
  </section>

  <!-- ════ MILESTONES / TIMELINE ════ -->
  <section>
    <h2 class="fade-in"><!-- Milestones heading here --></h2>
    <p class="section-subtitle fade-in"><!-- Milestones subtitle here --></p>
    <div class="section-divider fade-in"></div>
    <div class="milestones fade-in">
      <div class="milestone">
        <div class="milestone-date"><span class="milestone-date-placeholder"><!-- Date --></span></div>
        <div class="milestone-text-placeholder"><!-- Milestone description --></div>
      </div>
      <div class="milestone">
        <div class="milestone-date"><span class="milestone-date-placeholder"><!-- Date --></span></div>
        <div class="milestone-text-placeholder"><!-- Milestone description --></div>
      </div>
      <div class="milestone">
        <div class="milestone-date"><span class="milestone-date-placeholder"><!-- Date --></span></div>
        <div class="milestone-text-placeholder"><!-- Milestone description --></div>
      </div>
      <div class="milestone">
        <div class="milestone-date"><span class="milestone-date-placeholder"><!-- Date --></span></div>
        <div class="milestone-text-placeholder"><!-- Milestone description --></div>
      </div>
    </div>
  </section>

  <!-- ════ CLOSING ════ -->
  <div class="closing fade-in">
    <div class="closing-image-placeholder">
      <!-- <img src="closing-photo.jpg" alt=""> -->
      <span class="placeholder-label">Photo</span>
    </div>
    <div class="closing-message-placeholder">
      <!-- Final closing message here -->
      Closing message goes here
    </div>
    <div class="divider"></div>
    <p style="margin-top:1.5rem;">
      <span class="closing-name-placeholder"><!-- Your name --></span>
    </p>
  </div>

  <!-- ════ FOOTER ════ -->
  <footer>
    <!-- Footer text here -->
  </footer>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>
</body>
</html>
